<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>All Orders</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<script>
  const token = localStorage.getItem("adminToken");
  if (!token) window.location.replace("index.html");
</script>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <img src="assets/images/smart_canteen_logo.png" />
      <span>Smart Canteen</span>
    </div>

    <nav>
      <a onclick="location.href='dashboard.html'">📊 Dashboard</a>
      <a class="active">🧾 Orders</a>
      <a onclick="location.href='food_page.html'">🍔 Food Items</a>
      <a onclick="location.href='points_page.html'">🎯 Points Settings</a>
      <a onclick="location.href='users_page.html'">👤 Users</a>
      <a onclick="location.href='announcements_page.html'">📢 Announcements</a>
      <a onclick="adminLogout()">🚪 Logout</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">

    <header class="topbar">
      <h1>All Orders</h1>
      <span class="admin-name">Admin</span>
    </header>

    <section class="panel">
      <div class="panel-header">
        <h2>Orders</h2>

        <input
          type="text"
          id="orderSearch"
          placeholder="Search orders..."
          onkeyup="filterOrders()"
        />
      </div>

      <table class="orders-table">
        <thead>
            <tr>
                <th class="col-id">Order ID</th>
                <th class="col-date">Date</th>
                <th class="col-user">User</th>
                <th class="col-total">Total</th>
                <th class="col-status">Status</th>
                <th class="col-action">Action</th>
            </tr>
        </thead>

        <tbody id="ordersTable"></tbody>
      </table>
    </section>

  </main>
</div>

<script src="js/orders.js"></script>
<script>
function adminLogout() {
  const ok = confirm("Are you sure you want to logout?");

  if (!ok) return;

  localStorage.removeItem("adminToken");
  window.location.replace("index.html");
}
</script>
</body>
</html>
