<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Users</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<script>
  const token = localStorage.getItem("adminToken");
  if (!token) window.location.replace("index.html");
</script>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <img src="assets/images/smart_canteen_logo.png" />
      <span>Smart Canteen</span>
    </div>

    <nav>
      <a onclick="location.href='dashboard.html'">📊 Dashboard</a>
      <a onclick="location.href='orders.html'">🧾 Orders</a>
      <a onclick="location.href='food_page.html'">🍔 Food Items</a>
      <a onclick="location.href='points_page.html'">🎯 Points Settings</a>
      <a class="active">👤 Users</a>
      <a onclick="location.href='announcements_page.html'">📢 Announcements</a>
      <a onclick="adminLogout()">🚪 Logout</a>
    </nav>
  </aside>

  <!-- CONTENT -->
  <main class="content">

    <header class="topbar">
      <h1>Users</h1>
    </header>

    <section class="panel">
      <div class="panel-header">
        <h2>All Users</h2>
        <input
          type="text"
          id="userSearch"
          placeholder="Search users..."
          onkeyup="filterUsers()"
        />
      </div>

      <table class="users-table">
            <thead>
                <tr>
                <th class="col-id">ID</th>
                <th class="col-avatar">Avatar</th>
                <th class="col-user">Username</th>
                <th class="col-email">Email</th>
                <th class="col-points">Points</th>
                </tr>
            </thead>

            <tbody id="usersTable"></tbody>
        </table>

    </section>

  </main>
</div>

<script src="js/users_page.js"></script>
<script>
function adminLogout() {
  const ok = confirm("Are you sure you want to logout?");

  if (!ok) return;

  localStorage.removeItem("adminToken");
  window.location.replace("index.html");
}
</script>

</body>
</html>
